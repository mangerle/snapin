[package]
name = "snapin-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Snapin 跨平台桌面集成：截屏、剪贴板、热键、托盘、自启动与窗口能力"

[dependencies]
snapin-config.workspace = true
snapin-foundation.workspace = true
snapin-runtime.workspace = true
arc-swap.workspace = true
arboard.workspace = true
tokio.workspace = true
tracing.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
zbus.workspace = true
rustix.workspace = true
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = { version = "0.9", default-features = false }
tray-icon = { version = "0.26", default-features = false }
global-hotkey = { version = "0.9", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
