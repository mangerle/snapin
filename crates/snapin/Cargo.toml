[package]
name = "snapin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "专为 Linux Wayland (Ubuntu 26 GNOME) 打造的纯 Rust 截图与贴图工具"

[[bin]]
name = "snapin"
path = "src/main.rs"

[dependencies]
snapin-app.workspace = true
snapin-config.workspace = true
snapin-foundation.workspace = true
snapin-settings.workspace = true

clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Snapin"
identifier = "local.wangle.snapin"
category = "Utility"
description = "专为跨平台打造的高性能截图与桌面贴图工具"
long-description = "Snapin 是一款现代化截图与贴图工具，支持智能窗口吸附、置顶贴图、全屏秒级抓取与系统托盘。"
icons = [
  "../../assets/icons/32x32.png",
  "../../assets/icons/128x128.png",
  "../../assets/icons/256x256.png",
  "../../assets/icons/512x512.png",
  "../../assets/icons/icon.ico",
]
resources = [
  { src = "../../assets/models/ppocrv6", target = "models/ppocrv6" },
  { src = "../../assets/libs/windows/onnxruntime.dll", target = "onnxruntime.dll" },
  { src = "../../LICENSE", target = "licenses/LICENSE" },
  { src = "../../NOTICE", target = "licenses/NOTICE" },
  { src = "../../THIRD_PARTY_NOTICES.md", target = "licenses/THIRD_PARTY_NOTICES.md" },
  { src = "../../LICENSES/LicenseRef-Slint-Royalty-free-2.0.md", target = "licenses/LicenseRef-Slint-Royalty-free-2.0.md" }
]

[package.metadata.packager.windows]
digest-algorithm = "sha256"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
entitlements = ""
frameworks = []

[package.metadata.packager.deb]
depends = ["libwayland-client0", "libxkbcommon0", "libfontconfig1", "libfreetype6", "libdbus-1-3", "libonnxruntime1.23", "gstreamer1.0-tools", "gstreamer1.0-plugins-base", "gstreamer1.0-plugins-good", "gstreamer1.0-pipewire"]
section = "utils"
priority = "optional"

[package.metadata.packager.deb.files]
"../../extension/metadata.json" = "/usr/share/gnome-shell/extensions/snapin@wangle/metadata.json"
"../../extension/extension.js" = "/usr/share/gnome-shell/extensions/snapin@wangle/extension.js"
"../../assets/icons/snapin.svg" = "/usr/share/gnome-shell/extensions/snapin@wangle/icons/snapin-tray.svg"
"../../assets/icons/snapin-app.svg" = "/usr/share/icons/hicolor/scalable/apps/snapin.svg"
"../../assets/systemd/snapin.service" = "/usr/lib/systemd/user/snapin.service"
"../../assets/autostart/snapin.desktop" = "/etc/xdg/autostart/snapin.desktop"



