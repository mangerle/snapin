name: Release
# Snapin 全平台跨架构自动化发布流水线
# 采用 Tauri 官方打包核心 cargo-packager 与 alien，全自动矩阵出包:
# - Linux: .deb (x64/arm64) + .rpm (x64/arm64) + 免安装 .AppImage (x64/arm64)
# - Windows: NSIS 现代向导安装包 (.exe) + 绿色便携包 (.zip) (x64/arm64)
# - macOS: 苹果标准安装包 (.dmg / .app)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: 生成版本更新日志 (git-cliff)
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: 检出完整代码与提交历史 (fetch-depth 0)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成当前版本分类 Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - name: 上传 Changelog 临时产物
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: RELEASE_CHANGELOG.md

  build-linux:
    name: 构建 Linux 软件包 (${{ matrix.arch }} deb/rpm/appimage)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            rpm_arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            rpm_arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装系统开发依赖库与打包转换工具 (alien/rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            pkg-config \
            alien \
            rpm

      - name: 安装 cargo-packager CLI
        run: cargo install cargo-packager --locked

      - name: 编译 Release 二进制文件
        run: cargo build --release -p snapin

      - name: 编译并打包 Linux DEB 与 AppImage
        run: |
          cargo packager --release -p snapin --formats deb,appimage

      - name: 基于 DEB 包转换生成 RPM 软件包
        run: |
          mkdir -p target/release/dist-rpm
          for deb in target/release/snapin_*_${{ matrix.arch }}.deb target/release/snapin_*.deb; do
            if [ -f "$deb" ]; then
              echo "正在将 $deb 转换为 RPM 格式..."
              sudo alien --to-rpm --scripts --target ${{ matrix.rpm_arch }} "$deb" || sudo alien --to-rpm --scripts "$deb"
              mv *.rpm target/release/dist-rpm/ 2>/dev/null || true
              break
            fi
          done

      - name: 规整并上传 Linux 构建产物 (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-artifacts
          path: |
            target/release/snapin_*.deb
            target/release/snapin_*.AppImage
            target/release/dist-rpm/*.rpm

  build-windows:
    name: 构建 Windows 软件包 (cargo-packager x64/arm64)
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust 目标工具链 (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 启用 Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 cargo-packager CLI
        run: cargo install cargo-packager --locked

      - name: 编译 Release 二进制文件 (${{ matrix.target }})
        run: cargo build --release -p snapin --target ${{ matrix.target }}

      - name: 使用 cargo-packager 构建 Windows NSIS 安装包与便携包
        run: |
          cargo packager --release -p snapin --target ${{ matrix.target }} --formats nsis,zip

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-artifacts
          path: |
            target/${{ matrix.target }}/release/*.exe
            target/${{ matrix.target }}/release/*.zip

  build-macos:
    name: 构建 macOS 应用程序包 (cargo-packager dmg/app)
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 启用 Rust 依赖缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-packager CLI
        run: cargo install cargo-packager --locked

      - name: 编译 Release 二进制文件
        run: cargo build --release -p snapin

      - name: 使用 cargo-packager 构建 macOS DMG 镜像
        run: |
          cargo packager --release -p snapin --formats dmg

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: target/release/*.dmg

  publish-release:
    name: 汇总发布 GitHub Release
    needs: [changelog, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Changelog
        uses: actions/download-artifact@v4
        with:
          name: release-changelog

      - name: 下载 Linux amd64 产物
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-artifacts
          path: release-files

      - name: 下载 Linux arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: release-files

      - name: 下载 Windows x64 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-artifacts
          path: release-files

      - name: 下载 Windows arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-artifacts
          path: release-files

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-files

      - name: 配置 Rust 工具链并安装 shipup-cli
        if: env.SHIPUP_PRIVATE_KEY != ''
        env:
          SHIPUP_PRIVATE_KEY: ${{ secrets.SHIPUP_PRIVATE_KEY }}
        run: |
          cargo install shipup-cli --locked

      - name: 生成 Ed25519 签名与最新版本清单 (latest.json)
        if: env.SHIPUP_PRIVATE_KEY != ''
        env:
          SHIPUP_PRIVATE_KEY: ${{ secrets.SHIPUP_PRIVATE_KEY }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          CLEAN_VERSION="${TAG_NAME#v}"
          KEY_FILE="$(mktemp)"
          echo -n "$SHIPUP_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          NOTES_ARG=()
          if [ -f "RELEASE_CHANGELOG.md" ]; then
            NOTES_ARG=(--notes-file "RELEASE_CHANGELOG.md")
          fi

          for file in release-files/*; do
            [ -f "$file" ] || continue
            filename="$(basename "$file")"
            download_url="https://github.com/${REPO}/releases/download/${TAG_NAME}/${filename}"

            case "$filename" in
              *amd64.deb|*_x86_64.deb)
                shipup-cli release \
                  --version "$CLEAN_VERSION" \
                  --target "x86_64-unknown-linux-gnu" \
                  --package "$file" \
                  --url "$download_url" \
                  --package-type installer \
                  --key "$KEY_FILE" \
                  --manifest "release-files/latest.json" \
                  "${NOTES_ARG[@]}"
                ;;
              *arm64.deb|*_aarch64.deb)
                shipup-cli release \
                  --version "$CLEAN_VERSION" \
                  --target "aarch64-unknown-linux-gnu" \
                  --package "$file" \
                  --url "$download_url" \
                  --package-type installer \
                  --key "$KEY_FILE" \
                  --manifest "release-files/latest.json" \
                  "${NOTES_ARG[@]}"
                ;;
              *setup*.exe|*x64*setup*.exe|*x86_64*setup*.exe)
                shipup-cli release \
                  --version "$CLEAN_VERSION" \
                  --target "x86_64-pc-windows-msvc" \
                  --package "$file" \
                  --url "$download_url" \
                  --package-type installer \
                  --key "$KEY_FILE" \
                  --manifest "release-files/latest.json" \
                  "${NOTES_ARG[@]}"
                ;;
              *arm64*setup*.exe|*aarch64*setup*.exe)
                shipup-cli release \
                  --version "$CLEAN_VERSION" \
                  --target "aarch64-pc-windows-msvc" \
                  --package "$file" \
                  --url "$download_url" \
                  --package-type installer \
                  --key "$KEY_FILE" \
                  --manifest "release-files/latest.json" \
                  "${NOTES_ARG[@]}"
                ;;
              *x64*.zip|*x86_64*.zip)
                shipup-cli release \
                  --version "$CLEAN_VERSION" \
                  --target "x86_64-pc-windows-msvc" \
                  --package "$file" \
                  --url "$download_url" \
                  --package-type archive \
                  --key "$KEY_FILE" \
                  --manifest "release-files/latest.json" \
                  "${NOTES_ARG[@]}"
                ;;
              *arm64*.zip|*aarch64*.zip)
                shipup-cli release \
                  --version "$CLEAN_VERSION" \
                  --target "aarch64-pc-windows-msvc" \
                  --package "$file" \
                  --url "$download_url" \
                  --package-type archive \
                  --key "$KEY_FILE" \
                  --manifest "release-files/latest.json" \
                  "${NOTES_ARG[@]}"
                ;;
              *.dmg)
                shipup-cli release \
                  --version "$CLEAN_VERSION" \
                  --target "x86_64-apple-darwin" \
                  --package "$file" \
                  --url "$download_url" \
                  --package-type archive \
                  --key "$KEY_FILE" \
                  --manifest "release-files/latest.json" \
                  "${NOTES_ARG[@]}"
                ;;
            esac
          done

          rm -f "$KEY_FILE"

      - name: 发布至 GitHub Release 并自动挂载所有产品包
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_CHANGELOG.md
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

