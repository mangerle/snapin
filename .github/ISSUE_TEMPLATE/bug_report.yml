name: 缺陷报告
description: 报告可复现的功能异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索现有 Issue，并阅读 README 的常见问题。
        安全漏洞请使用私密报告渠道，不要在此公开细节。

  - type: input
    id: version
    attributes:
      label: Snapin 版本
      description: 运行 `snapin --version` 获取
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 桌面环境
      description: 发行版、GNOME Shell 版本与会话类型（`echo $XDG_SESSION_TYPE`）
      placeholder: "Ubuntu 26.04, GNOME 50, wayland"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: 安装方式
      options:
        - GitHub Releases 的 deb 包
        - 从源码构建的 deb 包
        - 直接运行 cargo build 产物
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小、稳定的操作序列
      placeholder: |
        1. 按下 Ctrl+Alt+A
        2. 框选包含文字的窗口
        3. 点击 OCR
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有报错、界面异常或崩溃，请描述具体表现
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 可运行 `journalctl --user -u snapin -b --no-pager | tail -n 100`，提交前请脱敏
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，未发现相同问题
          required: true
        - label: 我已阅读 README 中的常见问题
          required: true
        - label: 我已移除日志与截图中的密钥、剪贴板内容和敏感路径
          required: true
