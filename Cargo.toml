[package]
name = "snapin"
version = "0.3.0"
edition = "2021"
description = "专为 Linux Wayland (Ubuntu 26 GNOME) 打造的纯 Rust 截图与贴图工具"

[dependencies]
# 窗口事件循环与原生 Wayland 支持
winit = { version = "0.29", default-features = false, features = ["wayland", "rwh_06"] }

# 纯 CPU 软件光栅化与帧缓冲
softbuffer = { version = "0.4", features = ["wayland"] }
tiny-skia = "0.11"

# 图像操作与零拷贝像素裁剪
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"

# 异步运行时与 D-Bus 进程间通信
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
ashpd = { version = "0.8", default-features = false, features = ["tokio"] }

# 错误处理与结构化日志
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 命令行解析与配置持久化
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bytemuck = "1.14"
rustix = { version = "0.38", features = ["process"] }

# 纯 Rust 复杂多语言与中文字体排版引擎
cosmic-text = "0.11"

# 跨平台剪贴板操作 (支持 Wayland RGBA 图像与文本读写)
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control", "image-data"] }

# 现代声明式设置中心图形界面
slint = "1"

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tempfile = "3"

