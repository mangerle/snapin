[workspace]
members = [
    "crates/snapin-core",
    "crates/snapin-daemon",
    "crates/snapin-platform",
    "crates/snapin-ui",
    "crates/snapin-service",
    "crates/snapin-settings",
    "crates/snapin",
]
resolver = "2"

[workspace.package]
version = "1.1.1"
edition = "2021"
authors = ["wangle"]
license = "Apache-2.0"
repository = "https://github.com/mangerle/snapin"

[workspace.dependencies]
# 内部子包依赖
snapin-core = { path = "crates/snapin-core", version = "1.0.0" }
snapin-daemon = { path = "crates/snapin-daemon", version = "1.0.0" }
snapin-platform = { path = "crates/snapin-platform", version = "1.0.0" }
snapin-ui = { path = "crates/snapin-ui", version = "1.0.0" }
snapin-service = { path = "crates/snapin-service", version = "1.0.0" }
snapin-settings = { path = "crates/snapin-settings", version = "1.0.0" }

# 窗口事件循环与原生 Wayland 支持
winit = { version = "0.29", default-features = false, features = ["wayland", "rwh_06"] }

# 纯 CPU 软件光栅化与帧缓冲
softbuffer = { version = "0.4", features = ["wayland"] }
tiny-skia = "0.11"

# 图像操作与零拷贝像素裁剪
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = "0.4"

# 异步运行时与 D-Bus 进程间通信
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "process"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
ashpd = { version = "0.8", default-features = false, features = ["tokio"] }

# 错误处理与结构化日志
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 命令行解析与配置持久化
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bytemuck = "1.14"
rustix = { version = "0.38", features = ["process"] }

# HTTP 网络请求与异步服务抽象
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
async-trait = "0.1"
futures = "0.3"

# 密码学哈希与签名 (用于第三方翻译 API 鉴权)
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# 纯 Rust 复杂多语言与中文字体排版引擎
cosmic-text = "0.11"

# ONNX Runtime 动态加载推理 (复用系统 libonnxruntime，避免静态捆绑)
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }

# 跨平台剪贴板操作 (支持 Wayland RGBA 图像与文本读写)
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control", "image-data"] }

# 现代声明式设置中心图形界面
slint = "1"
slint-build = "1"

# 测试辅助依赖
tempfile = "3"
